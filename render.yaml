services:
  - type: web
    name: clipfarmpilot-web-pilot-dk
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: CLIPFARMPILOT_WEB_PASSWORD
        sync: false
      - key: CLIPFARMPILOT_SESSION_SECRET
        generateValue: true
      - key: CLIPFARMPILOT_STORAGE_DIR
        value: /tmp/clipfarmpilot
      - key: CLIPFARMPILOT_DELETE_PERMANENT
        value: "1"
