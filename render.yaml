services:
  - type: web
    name: clippilot-web-pilot-dk
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: CLIPPILOT_WEB_PASSWORD
        sync: false
      - key: CLIPPILOT_SESSION_SECRET
        generateValue: true
      - key: CLIPPILOT_STORAGE_DIR
        value: /tmp/clippilot
      - key: CLIPPILOT_DELETE_PERMANENT
        value: "1"
