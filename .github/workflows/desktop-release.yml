name: Build Windows and Linux releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag, such as v1.13.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop-requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          architecture: ${{ matrix.architecture }}
      - name: Build Windows ${{ matrix.architecture }} app
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          ./build_windows.ps1 -Version $version -Architecture $env:RELEASE_ARCHITECTURE
      - name: Test packaged Windows video pipeline and GUI launch
        shell: pwsh
        env:
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $runtimeFfmpeg = ".desktop-runtime\windows-arm64\ffmpeg.exe"
          if ($env:RELEASE_ARCHITECTURE -eq "arm64") {
            $ffmpeg = $runtimeFfmpeg
          } else {
            $ffmpeg = & ".build-venv-windows-x64\Scripts\python.exe" -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          }
          $source = Join-Path $env:RUNNER_TEMP "clipfarmpilot-smoke.mp4"
          & $ffmpeg -y -v error -f lavfi -i "color=c=navy:s=160x90:r=24:d=3.2" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=3.2" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest $source
          $env:CLIPFARMPILOT_STORAGE_DIR = Join-Path $env:RUNNER_TEMP "clipfarmpilot-data"
          $env:CLIPFARMPILOT_DELETE_PERMANENT = "1"
          $env:CLIPFARMPILOT_TEST_SOURCE = $source
          & "dist\ClipFarmPilot\ClipFarmPilot.exe"
          Remove-Item Env:\CLIPFARMPILOT_TEST_SOURCE
          $env:CLIPFARMPILOT_TEST_WINDOW = "1"
          & "dist\ClipFarmPilot\ClipFarmPilot.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}-release
          path: outputs/Clip-Farm-Pilot-Windows-*-${{ matrix.architecture }}.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          architecture: ${{ matrix.architecture }}
      - name: Install Linux desktop and video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-gi python3-venv gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libgtk-3-0 libwebkit2gtk-4.1-0 cmake ninja-build build-essential xvfb
      - name: Build Linux ${{ matrix.architecture }} app
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          chmod +x build_linux.sh
          CLIPFARMPILOT_VERSION="${RELEASE_TAG#v}" CLIPFARMPILOT_ARCHITECTURE="$RELEASE_ARCHITECTURE" ./build_linux.sh
      - name: Test packaged Linux video pipeline and GUI launch
        run: |
          SOURCE="$RUNNER_TEMP/clipfarmpilot-smoke.mp4"
          ffmpeg -y -v error -f lavfi -i "color=c=navy:s=160x90:r=24:d=3.2" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=3.2" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$SOURCE"
          CLIPFARMPILOT_STORAGE_DIR="$RUNNER_TEMP/clipfarmpilot-data" CLIPFARMPILOT_DELETE_PERMANENT=1 CLIPFARMPILOT_TEST_SOURCE="$SOURCE" dist/ClipFarmPilot/ClipFarmPilot
          CLIPFARMPILOT_STORAGE_DIR="$RUNNER_TEMP/clipfarmpilot-data" CLIPFARMPILOT_TEST_WINDOW=1 xvfb-run -a dist/ClipFarmPilot/ClipFarmPilot
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.architecture }}-release
          path: outputs/Clip-Farm-Pilot-Linux-*-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true
      - name: Upload desktop downloads to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
