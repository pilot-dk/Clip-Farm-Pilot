name: Test Clip Farm Pilot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg nodejs fonts-noto-color-emoji
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build deployment image
        run: docker build -t clipfarmpilot-web:test .
